# Prince of Persia Classic - opcoes lidas pelo launcher corrigido (ports/popclassic/port.cfg)
#
# POP_GL_MODE=firmware (padrao): usa o libEGL.so do firmware e deixa o jogo resolver o GLES1 sozinho
#   (libmali.so.1). Foi assim que o jogo abriu no R36S.
# POP_GL_MODE=scan: volta a procurar um blob Mali de 32 bits nos diretorios do sistema (ignora o blob rxp0).
# POP_GL_BLOB=/caminho/libmali.so: forca uma biblioteca GL de 32 bits especifica (implica scan).
#
#POP_GL_MODE=scan
#POP_GL_BLOB=/usr/lib/arm-linux-gnueabihf/libmali.so.1
