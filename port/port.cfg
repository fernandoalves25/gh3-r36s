# Options for Guitar Hero III (native). Edit with any text editor; lines are NAME=value.
TAP_MODE=0      # 1 = notes play as soon as their frets are held (no strumming); 0 = strum with the D-pad as in the game
VOLUME=100      # 0..100
LEFTY=0         # 1 = mirror the highway for left-handed play
VSYNC=1         # 0 = do not wait for the screen refresh
PERF_GOV=1      # 1 = full CPU/GPU/memory clocks while playing
SOFT_RENDER=0   # 1 = draw in software instead of the GPU (only if the picture is wrong)
