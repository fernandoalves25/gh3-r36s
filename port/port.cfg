# Opcoes do launcher do Guitar Hero III (nativo). As opcoes do jogo em si (palhetada, canhoto, volumes,
# velocidade da pista, controles...) ficam no menu Opcoes dentro do jogo e sao salvas em gh3.cfg.
VSYNC=1         # 0 = nao espera o refresh da tela
PERF_GOV=1      # 1 = clocks de CPU/GPU/memoria no maximo enquanto joga
SOFT_RENDER=0   # 1 = desenha por software em vez da GPU (so se a imagem sair errada)
